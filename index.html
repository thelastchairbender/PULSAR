'use strict';
// Deterministic seeded random numbers so every attempt on a seed plays the same level.
const RNG = (() => {
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash() {
    let h = 2166136261 >>> 0;
    for (let k = 0; k < arguments.length; k++) {
      let x = (arguments[k] | 0) >>> 0;
      for (let i = 0; i < 4; i++) { h ^= x & 255; h = Math.imul(h, 16777619) >>> 0; x >>>= 8; }
    }
    return h >>> 0;
  }
  function create(seed) {
    const f = mulberry32(seed >>> 0);
    return {
      next: f,
      range: (a, b) => a + (b - a) * f(),
      int: (a, b) => a + Math.floor(f() * (b - a + 1)),
      pick: (arr) => arr[Math.floor(f() * arr.length)],
      chance: (p) => f() < p,
    };
  }
  return { create, hash };
})();

<script>
'use strict';
// ============================================================================
// PULSAR — level model, physics and procedural generation.
//
// The world scrolls in "beats" locked to the music clock. Horizontal pixels
// are a piecewise-linear function of beats (speed portals stretch the track).
// Vertical positions are pixels from the floor of the tunnel.
//
// Controls model: tap = jump, orbs fire on tap/hold, gravity flips only via
// portals and blue/green orbs.
//
// Generation (guarantees solvability):
//   1. Simulate the player while *writing the intended input script*: jumps on
//      the beat grid, orbs placed exactly where the player will be mid-air,
//      gravity portals, speed portals.
//   2. Decorate with spikes / blocks / saws, keeping only the ones that never
//      touch the simulated trajectory (with safety margins).
// ============================================================================

  BEATS_PER_BAR: 4,
  SECTION_BARS: 8,
  PX_PER_BEAT: 230,     // at speed x1
  TUNNEL_H: 360,
  TUNNEL_TOP: 180,
  PLAYER_SIZE: 30,
  HIT_HALF_W: 9,
  HIT_INSET: 5,
  JUMP_T: 0.85,         // beats airborne for a plain jump (floaty, low gravity)
  JUMP_APEX: 175,       // px
  DASH_LEN: 0.5,        // beats a dash orb carries you (while held)
  JUDGE_WINDOW: 0.42,
  BUFFER: 0.24,         // beats a press is buffered before landing / reaching an orb

CFG.TRAVEL = CFG.TUNNEL_H - CFG.PLAYER_SIZE;

const TIERS = [

  { name: 'SURGE',       lore: 'lattice destabilizing. slam orbs active.',         grid: 0.5,  pJump: 0.7,  offScale: 0.6, pOrb: 0.6,  maxChain: 3, pPortal: 0.16, pPortalAir: 0.1,  minGap: 0.25, fill: 26, wBlock: 0.5,  wSaw: 0.4,  speeds: [1.5, 2],       orbs: { yellow: 4, pink: 2, blue: 2, green: 2, red: 2, black: 1, dash: 2 } },
  { name: 'OVERDRIVE',   lore: 'core temperature critical.',                      grid: 0.25, pJump: 0.7,  offScale: 0.5, pOrb: 0.65, maxChain: 3, pPortal: 0.18, pPortalAir: 0.12, minGap: 0.25, fill: 30, wBlock: 0.5,  wSaw: 0.5,  speeds: [1.5, 2, 3],    orbs: { yellow: 3, pink: 2, blue: 2, green: 3, red: 2, black: 2, dash: 2 } },

  { name: 'VOID',        lore: 'there is nothing out here but rhythm.',            grid: 0.25, pJump: 0.85, offScale: 0.65, pOrb: 0.8, maxChain: 6, pPortal: 0.25, pPortalAir: 0.18, minGap: 0.25, fill: 42, wBlock: 0.6,  wSaw: 0.65, speeds: [3],            orbs: { yellow: 2, blue: 2, green: 3, red: 3, black: 3, dash: 4 } },

const STORM_WORDS = ['ACCELERATE', 'NO ESCAPE', 'EVENT HORIZON', 'COLLAPSE', 'HOLD ON', 'BREACH', 'FASTER', 'DO NOT BLINK', 'OVERCLOCK', 'LIGHTSPEED', 'SUPERNOVA', 'CORE BREACH'];
const STORM_CUTS = ['glitch', 'warp', 'zoomblur', 'heartbeat', 'hyper', 'spin', 'flare', 'invert'];
const STATIC_WORDS = ['NO SIGNAL', 'PLEASE STAND BY', 'SIGNAL LOST', 'TRACKING...', 'CH ▲', 'PLAY ►', 'STATIC', 'WE INTERRUPT THIS BROADCAST', 'VERTICAL HOLD', 'ADJUST YOUR SET', 'REC ●', 'END OF TAPE'];
const STATIC_LORE = ['the broadcast ended years ago. you are still playing.', 'adjust your set. there is nothing wrong with your eyes.', 'between channels there is only rhythm.', 'this program contains no pulsar.', 'if you can read this, the tape is still rolling.'];
const STATIC_CUTS = ['channel', 'tracking', 'jitter', 'channel', 'invert'];
const CINEMA_WORDS = { glider: ['LIFT', 'THERMALS', 'SKYLINE', 'RIDE THE WIND', 'ALTITUDE'], phase: ['BLINK', 'NOW YOU SEE ME', 'PHASE', 'SHIFT', 'ELSEWHERE'], volt: ['OVERCHARGE', 'HIGH VOLTAGE', 'ARC', 'SURGE', 'CONDUCT'], orbit: ['SWING', 'PENDULUM', 'GRAVITY WELL', 'ORBIT', 'TIDE'], runner: ['RUN', 'FASTER', 'KEEP GOING'] };

// Colour themes cycle every section.
const THEMES = [
  { a: '#00f0ff', b: '#ff2bd6', c: '#8a5cff', bg1: '#050214', bg2: '#160a3a', sun: '#ff2bd6' },
  { a: '#ffb300', b: '#ff3d00', c: '#ff2bd6', bg1: '#12030a', bg2: '#3a0a1e', sun: '#ff6a00' },
  { a: '#39ff14', b: '#00e5ff', c: '#f6ff00', bg1: '#02120c', bg2: '#063a2a', sun: '#00e5ff' },
  { a: '#ffe600', b: '#2b6bff', c: '#ff2bd6', bg1: '#050a1a', bg2: '#0c1f5a', sun: '#2b6bff' },
  { a: '#ff2a5f', b: '#ffffff', c: '#ff9a00', bg1: '#140206', bg2: '#3a0512', sun: '#ff2a5f' },
  { a: '#b56bff', b: '#00ffc8', c: '#ff5cf0', bg1: '#0b0216', bg2: '#22063f', sun: '#b56bff' },
];

// ---------------------------------------------------------------------------
// Physics. Exact constant-acceleration integration so frame rate never
// changes the trajectory. `t` is the current beat (needed for dashes).
// ---------------------------------------------------------------------------
function stepPlayer(st, dt, t) {
  if (dt <= 0) return;
  const mode = st.mode || 'runner', lo = 0, hi = CFG.TRAVEL;
  if (mode === 'glider') {
    // Accelerate until the speed cap, then coast. Wall contact is solved
    // exactly too (impact time, then the rest of the step from rest), so the
    // path never depends on the step size.
    const up = -st.grav, acc = up * (st.held ? CFG.GLIDE_ACC : -CFG.GLIDE_ACC), vmax = CFG.GLIDE_VMAX;
    const vT = acc > 0 ? vmax : -vmax;
    const hitT = (p0, v0, a, d) => { // first time in (0, d] the motion reaches a wall
      let best = Infinity;
      for (const w of [lo, hi]) {
        const c0 = p0 - w;
        if (Math.abs(a) < 1e-9) { if (v0 !== 0) { const r = -c0 / v0; if (r > 1e-12 && r <= d) best = Math.min(best, r); } continue; }
        const disc = v0 * v0 - 2 * a * c0; if (disc < 0) continue;
        const sq = Math.sqrt(disc);
        for (const r of [(-v0 - sq) / a, (-v0 + sq) / a]) if (r > 1e-12 && r <= d) best = Math.min(best, r);
      }
      return best;
    };
    for (let g = 0; g < 4 && dt > 1e-12; g++) {
      if ((st.p <= lo && acc <= 0 && st.vy <= 0) || (st.p >= hi && acc >= 0 && st.vy >= 0)) { st.p = st.p <= lo ? lo : hi; st.vy = 0; return; }
      const tToV = (vT - st.vy) / acc, dA = Math.max(0, Math.min(dt, tToV));
      if (tToV <= 0) st.vy = vT;
      let h = dA > 0 ? hitT(st.p, st.vy, acc, dA) : Infinity;
      if (h <= dA) { st.p = st.p + st.vy * h + 0.5 * acc * h * h <= (lo + hi) / 2 ? lo : hi; st.vy = 0; dt -= h; continue; }
      if (dA > 0) { st.p += st.vy * dA + 0.5 * acc * dA * dA; st.vy = dA === tToV ? vT : st.vy + acc * dA; }
      const dB = dt - dA;
      if (dB > 0) {
        h = hitT(st.p, st.vy, 0, dB);
        if (h <= dB) { st.p = st.vy < 0 ? lo : hi; st.vy = 0; dt = dB - h; continue; }
        st.p += st.vy * dB;
      }
      dt = 0;
    }
    st.p = Math.max(lo, Math.min(hi, st.p));
    return;
  }
  if (mode === 'phase') { st.vy = 0; return; }
  if (mode === 'volt') {
    let p = st.p + st.vy * dt;
    for (let k = 0; k < 4; k++) {
      if (p < lo) { p = 2 * lo - p; st.vy = Math.abs(st.vy); }
      else if (p > hi) { p = 2 * hi - p; st.vy = -Math.abs(st.vy); }
      else break;
    }
    st.p = Math.max(lo, Math.min(hi, p));
    return;
  }
  if (mode === 'orbit') {
    st.phase += CFG.ORBIT_W * dt;
    st.amp = st.ampTarget + (st.amp - st.ampTarget) * Math.exp(-dt * 14);
    st.p = CFG.MID + st.amp * Math.sin(st.phase); st.vy = 0;
    return;
  }
  if (t < st.dashUntil) { st.vy = 0; return; }
  const a = st.grav * CFG.GRAVITY;
  let p = st.p + st.vy * dt + 0.5 * a * dt * dt, v = st.vy + a * dt;
  if (p < lo || p > hi) {
    // Hit a surface inside this step: find the exact impact time so the
    // result does not depend on step size, then continue from rest.
    const bound = p < lo ? lo : hi, c0 = st.p - bound;
    let tau = dt;
    const disc = st.vy * st.vy - 2 * a * c0;
    if (disc >= 0) {
      const sq = Math.sqrt(disc), r1 = (-st.vy - sq) / a, r2 = (-st.vy + sq) / a;
      let best = Infinity;
      if (r1 > -1e-9 && r1 <= dt + 1e-9) best = Math.min(best, Math.max(0, r1));
      if (r2 > -1e-9 && r2 <= dt + 1e-9) best = Math.min(best, Math.max(0, r2));
      if (best !== Infinity) tau = best;
    }
    const rem = dt - tau;
    const away = (bound === lo && a > 0) || (bound === hi && a < 0);
    if (away && rem > 0) { p = bound + 0.5 * a * rem * rem; v = a * rem; } else { p = bound; v = 0; }
    if (p < lo) { p = lo; v = 0; } else if (p > hi) { p = hi; v = 0; }
  }
  st.p = p; st.vy = v;
}
function isSettled(st) {
  return (st.grav < 0 && st.p <= 0) || (st.grav > 0 && st.p >= CFG.TRAVEL);
}
// side: for phase, the surface the intended path snapped to (so a player a
// few pixels off the path on a mid-air switch lands on the same side).
function applyMode(st, mode, side) {
  st.mode = mode; st.dashUntil = -1; st.held = false; st.buffer = -1;
  const S = CFG.PLAYER_SIZE;
  if (mode === 'phase') { st.p = side !== undefined ? side : st.p < CFG.MID ? 0 : CFG.TRAVEL; st.grav = st.p === 0 ? -1 : 1; st.vy = 0; }
  else if (mode === 'volt') { const dir = st.vy !== 0 ? Math.sign(st.vy) : -st.grav; st.vy = dir * CFG.VOLT_V; }
  else if (mode === 'orbit') { st.amp = CFG.ORBIT_SMALL; st.ampTarget = CFG.ORBIT_SMALL; st.phase = (st.p + S / 2 > CFG.MID + S / 2) ? Math.PI / 2 : -Math.PI / 2; st.p = CFG.MID + st.amp * Math.sin(st.phase); st.vy = 0; }
}
// The tap action of the current mode (runner jumps are handled separately).
function modeTap(st) {
  const mode = st.mode || 'runner';
  if (mode === 'phase') { st.p = st.p < CFG.MID ? CFG.TRAVEL : 0; st.grav = -st.grav; st.vy = 0; return 'phase'; }
  if (mode === 'volt') { st.vy = -st.vy; return 'volt'; }
  if (mode === 'orbit') { st.ampTarget = st.ampTarget === CFG.ORBIT_BIG ? CFG.ORBIT_SMALL : CFG.ORBIT_BIG; return 'orbit'; }
  if (mode === 'glider') return 'glide';
  return null;
}
function doJump(st) { st.vy = -st.grav * CFG.JUMP_V; }
function applyOrb(st, kind, t) {
  const o = ORBS[kind];
  if (o.flip) st.grav = -st.grav;
  if (o.dash) { st.dashUntil = t + CFG.DASH_LEN; st.vy = 0; }
  else st.vy = -st.grav * o.v * CFG.JUMP_V;
}
function applyPortal(st) { st.grav = -st.grav; }

// Does an obstacle touch a player box? ox/px are horizontal pixel positions,
// p = feet height from the floor. `pad` inflates the obstacle (verification).
function hitTest(o, ox, px, p, halfW, inset, pad, size) {
  const H = CFG.TUNNEL_H;
  size = size === undefined ? CFG.PLAYER_SIZE : size;
  const x0 = px - halfW, x1 = px + halfW;
  const y0 = p + inset, y1 = p + size - inset;
  if (o.type === 'spike') {
    const hw = o.w / 2 + pad, h = o.h + pad;
    if (x1 < ox - hw || x0 > ox + hw) return false;
    const u = Math.max(x0, Math.min(x1, ox));
    const hh = h * (1 - Math.abs(u - ox) / hw);
    return o.s === 0 ? (y0 < hh) : (y1 > H - hh);
  }
  if (o.type === 'block') {
    const hw = o.w / 2 + pad, h = o.h + pad;
    if (x1 < ox - hw || x0 > ox + hw) return false;
    return o.s === 0 ? (y0 < h) : (y1 > H - h);
  }
  if (o.type === 'saw') {
    const r = o.r * 0.86 + pad;
    const cx = Math.max(x0, Math.min(x1, ox)), cy = Math.max(y0, Math.min(y1, o.cy));
    const dx = cx - ox, dy = cy - o.cy;
    return dx * dx + dy * dy < r * r;
  }
  return false;
}

const SIM_RATE = 64; // samples per beat

// ---------------------------------------------------------------------------
class Level {
  constructor(seed, opts) {
    opts = opts || {};
    this.seed = seed >>> 0;
    this.startTier = Math.max(0, opts.startTier || 0);
    this.hard = opts.hard || 0;                   // extra density on top of the tier (HARD / INSANE)
    this.storm = opts.storm || false;             // true = neon storm, 'static' = broadcast, 'cinema' = cinematic
    this.bpm = opts.bpm || 160;
    this.modes = opts.modes || null;              // force these movement modes (cycled per section)
    this.modeSplit = !!opts.modeSplit;            // ...and switch again halfway through each section
    this.ease = !!opts.ease;                      // gentler generation
    this.boss = opts.boss === undefined ? -1 : opts.boss; // first boss section (static)
    this.hardBoss = !!opts.hardBoss;              // boss sections keep the full tier and escalate per phase
    // Every section opens with a clear stretch for its cutscene: no notes and
    // no obstacles for ~2.6 s, so a full-screen cinematic never hides danger.
    this.cineBeats = Math.max(4, 2 * Math.ceil(2.6 * this.bpm / 60 / 2));
    this.bossBeats = this.cineBeats * 2;
    this.fx = [];                                 // timed effect events, sorted by beat
    this.length = opts.length || Infinity;        // sections; Infinity = endless
    this.endBeat = this.length * CFG.SECTION_BEATS;
    this.finite = isFinite(this.length);
    this.notes = [];            // judgeable intended inputs (jump / orb), sorted
    this.events = [];           // all script events incl. portals, sorted
    this.sections = new Map();  // n -> { objs, samples }
    this.barSpeed = [];         // speed multiplier per bar
    this.barX = [0];            // px at the start of each bar
    this.eventsGenerated = 0;
    this.objsGenerated = 0;
    this.simState = { p: 0, vy: 0, grav: -1, dashUntil: -1, mode: 'runner', held: false, amp: 0, ampTarget: 0, phase: 0 };
  }

  // Difficulty ramps every section in endless mode, every two in a finite level.
  cineAt(n) { return n === 0 ? 4 : n === this.boss ? this.bossBeats : this.cineBeats; }
  isBoss(n) { return this.boss >= 0 && n >= this.boss && n < this.length; }
  tierParams(n) {
    let T = TIERS[this.tierFor(n)];
    if (this.hard && !this.isBoss(n)) {
      const h = this.hard;
      T = Object.assign({}, T, { fill: Math.round(T.fill * (1 + 0.2 * h)), pOrb: Math.min(0.9, T.pOrb * (1 + 0.15 * h)), maxChain: Math.min(8, T.maxChain + h), pJump: Math.min(0.9, T.pJump * (1 + 0.08 * h)) });
    }
    if (!this.ease && (!this.isBoss(n) || this.hardBoss)) return T;
    const k = this.isBoss(n) ? 0.75 : 1;
    const sp = T.speeds.filter(v => v <= 1.5);
    return Object.assign({}, T, {
      pJump: T.pJump * 0.85 * k, pOrb: T.pOrb * 0.7 * k, maxChain: Math.min(T.maxChain, 2), minGap: Math.max(T.minGap, 0.5),
      pPortal: T.pPortal * 0.6, pPortalAir: T.pPortalAir * 0.5, fill: Math.round(T.fill * 0.5 * k), offScale: T.offScale * 0.7,
      speeds: sp.length ? sp : [1],
    });
  }
  tierFor(n) { return Math.min(this.startTier + Math.floor(n / (this.finite ? 2 : 1)), TIERS.length - 1); }

  // beats -> horizontal px (piecewise linear through speed portals)
  X(t) {
    const B = CFG.BEATS_PER_BAR;
    let bar = Math.floor(t / B);
    if (bar < 0) return t * CFG.PX_PER_BEAT * (this.barSpeed[0] || 1);
    if (bar >= this.barSpeed.length) {
      const last = this.barSpeed.length - 1;
      if (last < 0) return t * CFG.PX_PER_BEAT;
      return this.barX[last] + (t - last * B) * CFG.PX_PER_BEAT * this.barSpeed[last];
    }
    return this.barX[bar] + (t - bar * B) * CFG.PX_PER_BEAT * this.barSpeed[bar];
  }
  speedAt(t) {
    const bar = Math.max(0, Math.floor(t / CFG.BEATS_PER_BAR));
    return this.barSpeed[Math.min(bar, this.barSpeed.length - 1)] || 1;
  }

  ensure(section) {
    while (this.eventsGenerated <= section + 2) this.genEvents(this.eventsGenerated++);
    while (this.objsGenerated <= section + 1) this.genObjects(this.objsGenerated++);
  }

  reset() {
    for (const f of this.notes) { f.judged = false; f.state = 0; f.hitAt = 0; f.used = false; }
    for (const sec of this.sections.values()) for (const o of sec.objs) { if (o.type === 'orb') { o.used = false; o.usedAt = 0; o.reached = false; o.hitState = null; o.rescued = false; } if (o.type === 'portal' || o.type === 'speed' || o.type === 'mode') o.passed = false; }
  }

  genEvents(n) {
    const tier = this.tierFor(n), T = this.tierParams(n);
    const rng = RNG.create(RNG.hash(this.seed, n, 11));
    const SB = CFG.SECTION_BEATS, B = CFG.BEATS_PER_BAR, t0 = n * SB, t1 = t0 + SB;
    const S = CFG.PLAYER_SIZE;
    const outro = n >= this.length; // past the finish line: empty victory lap

    // speed per bar (speed portal objects are added during decoration)
    for (let bar = n * CFG.SECTION_BARS; bar < (n + 1) * CFG.SECTION_BARS; bar++) {
      const prev = this.barSpeed.length ? this.barSpeed[this.barSpeed.length - 1] : 1;
      let mult = prev;
      if (n === 0 && bar < 4) mult = 1;
      else if (outro) mult = 1;
      else if (bar % CFG.SECTION_BARS === 0 || rng.chance(0.3)) mult = rng.pick(T.speeds);
      this.barSpeed.push(mult);
      this.barX.push(this.barX[this.barX.length - 1] + B * CFG.PX_PER_BEAT * mult);
    }

    const st = Object.assign({}, this.simState);
    const dt = 1 / SIM_RATE, nSteps = SB * SIM_RATE;
    // pick this section's mode (switch via a mode portal just after the drop)
    const modeSwitches = [];
    if (this.modes && !outro) {
      const L = this.modes.length, m0 = this.modes[(this.modeSplit ? 2 * n : n) % L];
      if (m0 !== st.mode) modeSwitches.push({ t: n === 0 ? t0 + 2 : t0 + 0.5, mode: m0 });
      if (this.modeSplit && L > 1) { const m1 = this.modes[(2 * n + 1) % L]; if (m1 !== m0) modeSwitches.push({ t: t0 + SB / 2, mode: m1 }); }
    } else if (n > 0 && !outro) {
      const avail = Object.keys(MODES).filter(m => MODES[m].minTier <= tier);
      const pick = () => (rng.chance(0.45) || avail.length === 1) ? 'runner' : rng.pick(avail.filter(m => m !== 'runner'));
      const m0 = pick();
      if (m0 !== st.mode) modeSwitches.push({ t: t0 + 0.5, mode: m0 });
      if (tier >= 3 && rng.chance(0.35)) { const m1 = pick(); if (m1 !== (m0)) modeSwitches.push({ t: t0 + SB / 2, mode: m1 }); }
    } else if (outro && st.mode !== 'runner') modeSwitches.push({ t: t0, mode: 'runner' });
    let msi = 0;
    const samples = new Array(nSteps + 1);
    const start = t0 + this.cineAt(n);
    const stop = outro ? t0 : (n === this.length - 1 ? t1 - 1.5 : t1 - 0.3);
    const gridSteps = Math.round(T.grid * SIM_RATE);
    let lastNoteT = -10, chain = 0;
    const orbKinds = Object.keys(T.orbs), orbTotal = orbKinds.reduce((a, k) => a + T.orbs[k], 0);
    const pickOrb = () => { let r = rng.next() * orbTotal; for (const k of orbKinds) { r -= T.orbs[k]; if (r <= 0) return k; } return orbKinds[0]; };

    for (let i = 0; i <= nSteps; i++) {
      const t = t0 + i * dt;
      while (msi < modeSwitches.length && modeSwitches[msi].t <= t + 1e-9) { const ms = modeSwitches[msi++]; applyMode(st, ms.mode); this.events.push({ t: ms.t, kind: 'mode', mode: ms.mode, side: ms.mode === 'phase' ? st.p : undefined }); lastNoteT = ms.t + 0.5; }
      const mode = st.mode || 'runner';
      if (mode !== 'runner' && i < nSteps && i % gridSteps === 0 && t >= start && t < stop && t >= lastNoteT + Math.max(T.minGap, 0.5) - 1e-9) {
        const barPos = t % B, onBeat = Math.abs(barPos - Math.round(barPos)) < 1e-6;
        const pr = T.pJump * (onBeat ? 0.9 : T.offScale * 0.8);
        if (rng.chance(pr)) {
          if (mode === 'glider') { st.held = !st.held; const note = { t, kind: 'glide', on: st.held, cy: st.p + S / 2, judged: false, state: 0, hitAt: 0 }; this.events.push(note); this.notes.push(note); }
          else { const sf = st.grav < 0 ? 0 : 1, cy0 = st.p + S / 2; const kind = modeTap(st); const note = { t, kind, surfaceFrom: sf, cy: cy0, judged: false, state: 0, hitAt: 0 }; this.events.push(note); this.notes.push(note); }
          lastNoteT = t;
        }
      } else if (mode === 'runner' && i < nSteps && i % gridSteps === 0 && t >= start && t < stop && t >= lastNoteT + T.minGap - 1e-9 && t >= st.dashUntil) {
        const settled = isSettled(st);
        const barPos = t % B, onBeat = Math.abs(barPos - Math.round(barPos)) < 1e-6;
        const inBar = Math.floor((t - t0) / B);
        const dens = inBar === 7 ? 0.6 : 1;
        if (settled) {
          const r = rng.next();
          const pJ = T.pJump * (onBeat ? 1 : T.offScale) * dens;
          if (r < T.pPortal * dens) {
            this.events.push({ t, kind: 'portal' }); applyPortal(st); lastNoteT = t;
          } else if (r < T.pPortal * dens + pJ) {
            const note = { t, kind: 'jump', surfaceFrom: st.grav < 0 ? 0 : 1, judged: false, state: 0, hitAt: 0 };
            this.events.push(note); this.notes.push(note); doJump(st); lastNoteT = t; chain = 0;
          }
        } else if (chain < T.maxChain && rng.chance(T.pOrb * dens)) {
          const kind = pickOrb();
          const note = { t, kind: 'orb', orb: kind, cy: st.p + S / 2, grav: st.grav, judged: false, state: 0, hitAt: 0 };
          this.events.push(note); this.notes.push(note); applyOrb(st, kind, t); lastNoteT = t; chain++;
        } else if (rng.chance(T.pPortalAir * dens)) {
          this.events.push({ t, kind: 'portal' }); applyPortal(st); lastNoteT = t;
        }
      }
      samples[i] = { t, p: st.p, x: this.X(t), vy: st.vy, grav: st.grav, dashUntil: st.dashUntil, mode: st.mode || 'runner' };
      if (i < nSteps) stepPlayer(st, dt, t);
    }
    this.simState = Object.assign({}, st);
    this.sections.set(n, { objs: [], samples });
    if (this.storm && !outro) this.genStorm(n, rng);
  }

  // A storm of effects: something every beat, a cutscene every two bars.
  genStorm(n, rng) {
    const B = CFG.BEATS_PER_BAR, clearUntil = n * CFG.SECTION_BEATS + this.cineAt(n);
    if (this.storm === 'static') {
      // Broadcast storm: only light, see-through effects while notes play.
      for (let bar = n * CFG.SECTION_BARS; bar < (n + 1) * CFG.SECTION_BARS; bar++) {
        const t = bar * B;
        if (t < clearUntil) continue;
        if (rng.chance(0.5)) this.fx.push({ t, kind: 'tracking', dur: rng.range(0.25, 0.45) });
        for (let k = 0; k < B; k++) if (rng.chance(0.3)) this.fx.push({ t: t + k + rng.range(0, 0.75), kind: 'jitter', dur: 0.06 });
        if (bar % 2 === 1) this.fx.push({ t: t + 1.5, kind: rng.pick(STATIC_CUTS), dur: rng.range(0.4, 0.8) });
        if (bar % 4 === 1) this.fx.push({ t, kind: 'text', text: rng.pick(STATIC_WORDS), sub: 'CH ' + String(rng.int(1, 99)).padStart(2, '0') + '  ·  ' + String(bar).padStart(3, '0') });
        if (bar % 8 === 4) this.fx.push({ t, kind: 'lore', text: rng.pick(STATIC_LORE) });
        if (bar % 3 === 1) this.fx.push({ t: t + 2, kind: 'flash', a: 0.35, color: '#ffffff' });
      }
      this.fx.sort((a, b) => a.t - b.t);
      return;
    }
    if (this.storm === 'cinema') {
      // Mode levels: rings and flashes on the downbeat, a see-through
      // cinematic every two bars, banners every four.
      const words = CINEMA_WORDS[(this.modes && this.modes[(this.modeSplit ? 2 * n : n) % this.modes.length]) || 'runner'] || CINEMA_WORDS.runner;
      for (let bar = n * CFG.SECTION_BARS; bar < (n + 1) * CFG.SECTION_BARS; bar++) {
        const t = bar * B;
        if (t < clearUntil) continue;
        this.fx.push({ t, kind: 'rings' }, { t, kind: 'flash', a: 0.25 });
        if (bar % 2 === 1) this.fx.push({ t: t + 2, kind: rng.pick(['zoomblur', 'heartbeat', 'flare', 'spin', 'chroma', 'roll']), dur: rng.range(0.7, 1.1), a: 0.15 });
        if (bar % 4 === 2) this.fx.push({ t, kind: 'text', text: rng.pick(words), sub: 'BAR ' + String(bar + 1).padStart(3, '0') });
      }
      this.fx.sort((a, b) => a.t - b.t);
      return;
    }
    for (let bar = n * CFG.SECTION_BARS; bar < (n + 1) * CFG.SECTION_BARS; bar++) {
      const t = bar * B;
      if (bar === 0 || t < clearUntil) continue;
      this.fx.push({ t, kind: 'flash', a: 0.5 });
      for (let k = 0; k < B; k++) this.fx.push({ t: t + k, kind: 'bolts', n: 2 + (k === 0 ? 2 : 0) });
      this.fx.push({ t: t + 2, kind: rng.pick(['shake', 'zoom', 'roll', 'burst', 'chroma']), a: rng.range(0.08, 0.2) * 100 / 100 });
      if (bar % 2 === 1) this.fx.push({ t: t + 1, kind: rng.pick(STORM_CUTS), dur: rng.range(0.8, 1.4) });
      if (bar % 4 === 0) this.fx.push({ t, kind: 'text', text: rng.pick(STORM_WORDS), sub: 'HYPERNOVA // BAR ' + String(bar).padStart(3, '0') });
      if (bar % 8 === 4) this.fx.push({ t, kind: 'lore', text: rng.pick(['speed is a lie. the beat is real.', 'you are past the horizon now.', 'every orb is a heartbeat.', 'do not look at the spikes. look at the pads.']) });
      if (bar % 3 === 0) this.fx.push({ t: t + 3, kind: 'theme', idx: rng.int(0, 5) });
    }
    this.fx.sort((a, b) => a.t - b.t);
  }

  genObjects(n) {
    const tier = this.tierFor(n), T = this.tierParams(n);
    if (n >= this.length) {
      if (n === this.length) this.sections.get(n).objs.push({ type: 'finish', t: this.endBeat, s: -1 });
      return;
    }
    const rng = RNG.create(RNG.hash(this.seed, n, 23));
    const SB = CFG.SECTION_BEATS, B = CFG.BEATS_PER_BAR, t0 = n * SB, t1 = t0 + SB;
    const H = CFG.TUNNEL_H, S = CFG.PLAYER_SIZE;
    const sec = this.sections.get(n), next = this.sections.get(n + 1);
    const samples = sec.samples.concat(next ? next.samples.slice(0, 2 * SIM_RATE) : []);
    const objs = sec.objs;
    const X = (t) => this.X(t);

    const minT = t0 + (n === 0 ? 3 : this.cineAt(n)), maxT = n === this.length - 1 ? t1 - 1.5 : t1 - 0.3;
    const spanOf = (o) => (o.type === 'saw' || o.type === 'orb') ? o.r * 2 : (o.type === 'portal' || o.type === 'speed' || o.type === 'mode') ? 70 : o.w;
    const clear = (t, w, s) => {
      const x = X(t);
      for (const e of objs) {
        if (e.type === 'orb') continue;
        if (e.type === 'finish') continue;
        if (e.type !== 'saw' && e.type !== 'portal' && e.type !== 'speed' && e.type !== 'mode' && s !== -1 && e.s !== s) continue;
        if (Math.abs(X(e.t) - x) < (spanOf(e) + w) / 2 + 14) return false;
      }
      return true;
    };
    // Safety margin scales with track speed so it always covers ~55ms of
    // timing error horizontally, plus a vertical cushion.
    const safe = (o) => {
      const ox = X(o.t), sp = this.speedAt(o.t), hm = 34 * sp, reach = spanOf(o) / 2 + hm + 40;
      for (let i = 0; i < samples.length; i++) {
        const s = samples[i];
        if (s.x < ox - reach || s.x > ox + reach) continue;
        const vpad = s.mode === 'volt' ? 60 : s.mode === 'glider' ? 42 : s.mode === 'orbit' ? 24 : 14;
        if (hitTest(o, ox, s.x, s.p, CFG.HIT_HALF_W + hm, -vpad, 12)) return false;
      }
      return true;
    };
    const add = (o) => {
      if (o.t < minT || o.t > maxT) return false;
      if (!clear(o.t, spanOf(o), o.s)) return false;
      if (!safe(o)) return false;
      objs.push(o);
      return true;
    };
    const spike = (s, t) => ({ type: 'spike', t, s, w: 56, h: 40 });
    const spikeGroup = (s, t, k) => {
      let added = 0;
      const wB = 56 / (CFG.PX_PER_BEAT * this.speedAt(t));
      for (let i = 0; i < k; i++) { if (add(spike(s, t + (i - (k - 1) / 2) * wB))) added++; else break; }
      return added;
    };
    const block = (s, t) => ({ type: 'block', t, s, w: rng.pick([60, 100, 150, 220]), h: rng.pick([70, 100, 130, 170, 210]) });
    const saw = (t) => ({ type: 'saw', t, s: -1, cy: rng.chance(0.5) ? H / 2 : rng.pick([H * 0.28, H * 0.72]), r: rng.pick([34, 42, 52]), spin: rng.chance(0.5) ? -1 : 1 });
    const snap = (t) => Math.round(t * 8) / 8;

    // portals, speed portals and orbs come straight from the script
    for (const ev of this.events) {
      if (ev.t < t0 || ev.t >= t1) continue;
      if (ev.kind === 'portal') objs.push({ type: 'portal', t: ev.t, s: -1, passed: false });
      else if (ev.kind === 'mode') objs.push({ type: 'mode', t: ev.t, s: -1, mode: ev.mode, side: ev.side, passed: false });
      else if (ev.kind === 'orb') objs.push({ type: 'orb', t: ev.t, s: -1, cy: ev.cy, r: 19, kind: ev.orb, used: false, usedAt: 0, note: ev });
    }
    for (let bar = n * CFG.SECTION_BARS; bar < (n + 1) * CFG.SECTION_BARS; bar++) {
      if (bar > 0 && this.barSpeed[bar] !== this.barSpeed[bar - 1]) objs.push({ type: 'speed', t: bar * B, s: -1, mult: this.barSpeed[bar], passed: false });
    }

    // obstacles anchored to jumps: things under the arc you must clear
    for (const ev of this.events) {
      if (ev.t < t0 || ev.t >= t1 || ev.kind !== 'jump') continue;
      const s = ev.surfaceFrom;
      const r = rng.next();
      if (r < 0.45) spikeGroup(s, snap(ev.t + rng.range(0.24, 0.36)), rng.int(1, tier >= 2 ? 3 : 2));
      else if (r < 0.75) add(block(s, snap(ev.t + rng.range(0.25, 0.35))));
      if (rng.chance(0.3)) spikeGroup(1 - s, snap(ev.t + rng.range(-0.3, 0.6)), rng.int(1, 2));
    }
    // random fillers, all verified against the trajectory
    const total = 1 + T.wBlock + T.wSaw;
    for (let i = 0; i < T.fill; i++) {
      const t = snap(rng.range(minT, maxT)), r = rng.next() * total;
      if (r < 1) spikeGroup(rng.int(0, 1), t, rng.int(1, tier >= 3 ? 3 : 2));
      else if (r < 1 + T.wBlock) add(block(rng.int(0, 1), t));
      else add(saw(t));
    }
    if (this.isBoss(n)) this.genBoss(n, rng, samples, objs, minT, maxT, safe, add);
    objs.sort((a, b) => a.t - b.t);
  }

  // Boss attacks: telegraphed static beams across a height band, and shots
  // thrown from the boss. Every attack is checked against the intended path.
  genBoss(n, rng, samples, objs, minT, maxT, safe, add) {
    const S = CFG.PLAYER_SIZE, H = CFG.TUNNEL_H, BAND = 44, DUR = 0.5;
    const beamSafe = (o) => {
      for (const s of samples) {
        if (s.t < o.t - 0.08 || s.t > o.t + o.dur + 0.08) continue;
        const y0 = s.p - 14, y1 = s.p + S + 14;
        if (y1 > o.cy - o.h / 2 && y0 < o.cy + o.h / 2) return false;
      }
      return true;
    };
    const bands = [42, 110, 180, 250, 318];
    // A hard boss escalates: each phase (boss section) fires more often, and
    // later phases fire two beams at once.
    const phase = n - this.boss, hb = this.hardBoss;
    const pBeam = hb ? Math.min(0.85, 0.55 + 0.15 * phase) : 0.42, pDouble = hb ? [0, 0.35, 0.6][Math.min(2, phase)] : 0;
    const pSaw = hb ? 0.3 + 0.08 * phase : 0.22;
    for (let t = Math.ceil(minT) + 1; t < maxT - 1; t += 1) {
      if (rng.chance(pBeam)) {
        const order = bands.slice().sort(() => rng.next() - 0.5);
        let placed = 0; const want = rng.chance(pDouble) ? 2 : 1;
        for (const cy of order) { const o = { type: 'beam', t, dur: DUR, cy, h: BAND, s: -1, boss: true, phase }; if (beamSafe(o)) { objs.push(o); if (++placed >= want) break; } }
      }
      if (rng.chance(pSaw)) {
        const o = { type: 'saw', t: t + 0.5, s: -1, cy: rng.pick([H * 0.3, H / 2, H * 0.7]), r: 30, spin: 1, boss: true };
        add(o);
      }
    }
  }

  forEachObject(t0, t1, fn) {
    const SB = CFG.SECTION_BEATS;
    const n0 = Math.max(0, Math.floor(t0 / SB)), n1 = Math.floor(t1 / SB);
    for (let n = n0; n <= n1; n++) {
      const sec = this.sections.get(n);
      if (!sec) continue;
      for (const o of sec.objs) { if (o.t < t0 - 1) continue; if (o.t > t1 + 1) break; fn(o); }
    }
  }

  firstNoteAfter(t) {
    let lo = 0, hi = this.notes.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (this.notes[m].t < t) lo = m + 1; else hi = m; }
    return lo;
  }
}

// ---------------------------------------------------------------------------
// A hand-built level from the editor. Same interface as Level, but every
// object, note and effect comes straight from the data.
// data: { name, bpm, bars, baseSpeed, objects: [...], fx: [...] }
// ---------------------------------------------------------------------------
class CustomLevel {
  constructor(data) {
    this.custom = true;
    this.data = data;

  scheduleStep(i, t) {

  // ---- instruments -------------------------------------------------------

'use strict';

const easeOut = (k) => 1 - Math.pow(1 - k, 3);

  constructor() {

    this.flash = 0; this.flashColor = WHITE;
    this.chroma = 0; this.zoomKick = 0; this.rotKick = 0;

  push(p) { if (this.parts.length >= this.MAX) this.parts.shift(); this.parts.push(p); }

  // Radial burst. x is world-px (scrolls) unless o.screen is set.
  burst(x, y, o) {
    const n = o.n || 12;

      const spread = o.spread !== undefined ? o.spread : Math.PI * 2;
      const ang = (o.angle !== undefined ? o.angle : Math.random() * Math.PI * 2) + (Math.random() - 0.5) * spread;
      const sp = (o.speed || 200) * (0.35 + Math.random() * 0.9);
      const col = o.colors ? o.colors[(Math.random() * o.colors.length) | 0] : (o.color || WHITE);
      this.push({
        x, y, vx: Math.cos(ang) * sp + (o.vx || 0), vy: Math.sin(ang) * sp + (o.vy || 0),
        life: (o.life || 0.6) * (0.55 + Math.random() * 0.8), age: 0,
        size: (o.size || 3) * (0.5 + Math.random()), color: col, shape: o.shape || 'dot',

  }
  // Particles that converge on a point (boot cutscene). Screen-space.
  converge(tx, ty, n, color, dur) {

      const x = tx + Math.cos(ang) * d, y = ty + Math.sin(ang) * d;

  wave(x, y, o) {
    this.waves.push({ x, y, r0: o.r0 || 8, r1: o.r1 || 120, life: o.life || 0.5, age: 0, color: o.color || WHITE, width: o.width || 4, screen: !!o.screen, sides: o.sides || 0 });
  }
  popup(text, x, y, color, size, o) {
    o = o || {};

  update(wdt, rdt) {
    const parts = this.parts;

  drawWorld(c, toX) {

        c.strokeStyle = rgba(this.tone(p.color), 1); c.lineWidth = 2;

  supportsFilter: (() => {
    try { const c = document.createElement('canvas').getContext('2d'); return typeof c.filter === 'string'; } catch (e) { return false; }
  })(),

  // Additive blurred copies of the scene = glow on everything bright.
  bloom(ctx, scene, bloomA, bloomB, cw, ch, strength) {

  // VHS tracking band + noise lines, drawn on top in device pixels.
  vhs(ctx, cw, ch, t, strength) {

        .catch(() => setStatus('could not open the stored song — attach it again with CHOOSE FILE'));
    }
  }
  function update(dt) {
    if (root && !root.classList.contains('open')) root.classList.add('open');
    statusT -= dt; leaveArmed -= dt; overwriteT -= dt;
    if (previewing) {
      cursor = Math.max(0, api.audio.beatNow());
      if (data.music === 'composer') highlightStep(((Math.floor(cursor * 4) % 16) + 16) % 16);
      if (cursor > data.bars * 4 + 4) stopPreview();
    }
    api.setCursor(cursor);
  }
  function hideUI() { stopPreview(); showHelp = false; if (root) root.classList.remove('open'); }
  function toolbarHeight() { return root && root.classList.contains('open') ? root.getBoundingClientRect().height : 0; }
  function key(e) {
    const k = e.code, ctrl = e.ctrlKey || e.metaKey;
    if (ctrl) {
      if (k === 'KeyS') { e.preventDefault(); save(); }
      else if (k === 'KeyZ' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if (k === 'KeyY' || (k === 'KeyZ' && e.shiftKey)) { e.preventDefault(); redo(); }
      else if (k === 'KeyC') { e.preventDefault(); copyBar(); }
      else if (k === 'KeyV') { e.preventDefault(); pasteBar(); }
      else if (k === 'KeyD') { e.preventDefault(); duplicateBar(); }
      return;
    }
    if (previewing && (k === 'Escape' || k === 'Space' || k === 'KeyP')) { e.preventDefault(); stopPreview(); return; }
    if (k === 'KeyR' && previewing) { place(mouse.x, mouse.in ? mouse.y : api.metrics.BOT - 20, api.audio.beatNow()); return; }
    if (k === 'KeyP') { togglePreview(); return; }
    if (k === 'KeyH' || e.key === '?') { showHelp = !showHelp; return; }
    if (k === 'Escape') {
      e.preventDefault();
      if (showHelp) { showHelp = false; return; }
      if (selected) { selected = null; setStatus('deselected'); return; }
      leave(); return;
    }
    if (k === 'Space' || k === 'Enter') { e.preventDefault(); if (!e.repeat) play(cursor); return; }
    if (k === 'ArrowLeft' || k === 'KeyA') cursor = Math.max(0, cursor - (e.shiftKey ? 4 : SNAP));
    else if (k === 'ArrowRight' || k === 'KeyD') cursor = Math.min(maxCursor(), cursor + (e.shiftKey ? 4 : SNAP));
    else if (k === 'Home') cursor = 0;
    else if (k === 'End') cursor = data.bars * 4;
    else if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); if (selected) removeItem(selected); else if (mouse.in) removeItem(pick(mouse.x, mouse.y)); }
    else { const t = TOOLS.find(x => x[2] === e.key.toUpperCase()); if (t) setTool(t[0]); }
  }
  function wheel(e) { stopPreview(); cursor = clamp(cursor + (e.deltaY + e.deltaX) * 0.01 * (e.shiftKey ? 4 : 1), 0, maxCursor()); }
  function move(e) {
    const p = api.toLogical(e); mouse.x = p.x; mouse.y = p.y; mouse.in = true;
    if (drag) { dragTo(p); return; }
    hover = pick(p.x, p.y);
  }
  function down(e) {
    const p = api.toLogical(e); mouse.x = p.x; mouse.y = p.y; mouse.in = true;
    if (showHelp) { showHelp = false; return; }
    if (e.button === 2) { removeItem(pick(p.x, p.y)); return; }
    if (e.button === 1 || tool === 'move') {
      const hit = e.button === 1 ? null : pick(p.x, p.y);
      if (hit) { selected = hit; loadOptsFrom(hit); drag = { kind: 'item', p: hit, moved: false }; setStatus('selected ' + (hit.kind === 'fx' ? hit.o.kind + ' effect' : hit.o.type) + ' — drag to move · option boxes edit it · DEL removes'); }
      else { selected = null; drag = { kind: 'pan', x0: p.x, c0: cursor }; }
      return;
    }
    if (tool === 'erase') { removeItem(pick(p.x, p.y)); return; }
    place(p.x, p.y); hover = pick(p.x, p.y);
  }
  function dragTo(p) {
    if (drag.kind === 'pan') {
      const pxPerBeat = CFG.PX_PER_BEAT * api.level.speedAt(cursor);
      cursor = clamp(drag.c0 + (drag.x0 - p.x) / pxPerBeat, 0, maxCursor()); stopPreview();
      return;
    }
    const o = drag.p.o, t = Math.min(snap(tAt(p.x)), data.bars * 4);
    o.t = drag.p.kind === 'obj' && o.type === 'speed' ? Math.round(t) : t;
    if (drag.p.kind === 'obj') {
      if (o.type === 'spike' || o.type === 'block' || (o.type === 'pad' && (o.kind === 'jump' || o.kind === 'phase'))) o.s = surfaceAt(p.y);
      else if (o.type === 'saw' || o.type === 'orb' || o.type === 'pad') o.cy = cyAt(p.y);
      if (o.type === 'orb') o.grav = surfaceAt(p.y) === 1 ? 1 : -1;
    }
    drag.moved = true; api.refresh();
  }
  function up() {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.kind === 'item' && d.moved) { touch(); setStatus('moved to ' + fmtBeat(d.p.o.t)); }
  }

  // ---- overlay ------------------------------------------------------------
  function draw(c) {
    const m = api.metrics, lv = api.level, W = m.W, H = m.H, OY = m.OY, TOP = m.TOP + OY, BOT = m.BOT + OY;
    const text = api.text;
    // beat grid
    const startT = Math.max(0, Math.floor(lv.tAtX(lv.X(cursor) - m.PX)) - 1), endT = Math.ceil(lv.tAtX(lv.X(cursor) + W - m.PX)) + 1;
    const subs = Math.round(1 / SNAP);
    for (let b = startT; b <= endT; b++) {
      const x = xOf(b), bar = b % 4 === 0;
      c.strokeStyle = bar ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.08)'; c.lineWidth = bar ? 1.5 : 1;
      c.beginPath(); c.moveTo(x, TOP - 100); c.lineTo(x, BOT + 30); c.stroke();
      if (bar) text(c, 'BAR ' + (b / 4 + 1), x + 4, BOT + 24, { size: 11, color: [200, 200, 230], spacing: 1, weight: 700 });
      if (subs > 1 && subs <= 8) for (let q = 1; q < subs; q++) { const xq = xOf(b + q / subs); c.strokeStyle = 'rgba(255,255,255,0.05)'; c.beginPath(); c.moveTo(xq, TOP); c.lineTo(xq, BOT); c.stroke(); }
    }
    // waveform of the uploaded song, aligned to the beat grid
    if (track && data.music === 'file') {
      const pk = track.peaks, off = (data.audio && data.audio.offset) || 0, spb = 60 / data.bpm, y0 = BOT + 64, hh = 28;
      c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(0, y0 - hh - 4, W, hh * 2 + 8);
      c.fillStyle = 'rgba(0,240,255,0.75)';
      let prev = Math.floor((off + tAt(-2) * spb) * PEAK_RATE);
      for (let x = 0; x < W; x += 2) {
        const i1 = Math.floor((off + tAt(x + 2) * spb) * PEAK_RATE);
        let mx = 0; for (let i = Math.max(0, prev); i <= Math.min(pk.length - 1, Math.max(prev, i1)); i++) if (pk[i] > mx) mx = pk[i];
        prev = i1;
        if (mx > 0) { const h = Math.max(1, mx * hh); c.fillRect(x, y0 - h, 2, h * 2); }
      }
      const s0 = xOf(-off / spb); c.fillStyle = 'rgba(255,255,255,0.8)'; c.fillRect(s0, y0 - hh - 6, 2, hh * 2 + 12);
      text(c, '♪ ' + track.name.toUpperCase().slice(0, 40), 12, y0 - hh - 8, { size: 11, color: [0, 240, 255], spacing: 2, weight: 700 });
    }
    // end of level
    const xe = xOf(data.bars * 4);
    c.fillStyle = 'rgba(0,0,0,0.5)'; c.fillRect(xe, TOP - 100, W, BOT - TOP + 130);
    text(c, 'FINISH', xe + 8, TOP - 86, { size: 12, color: [255, 255, 255], spacing: 3, weight: 700 });
    // effect markers
    const lanes = fxLanes();
    (data.fx || []).forEach((e, i) => {
      const x = xOf(e.t); if (x < -300 || x > W + 20) return;
      const y = laneY(lanes[i] || 0) + OY, label = fxLabel(e);
      const w = label.length * 6.6 + 12;
      const sel = selected && selected.o === e, hot = hover && hover.o === e;
      c.fillStyle = sel ? 'rgba(0,240,255,0.95)' : hot ? 'rgba(255,60,90,0.9)' : 'rgba(181,107,255,0.85)'; c.fillRect(x - 3, y - 9, w, 18);
      c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x, y + 9); c.lineTo(x, TOP); c.stroke();
      text(c, label, x + 4, y + 4, { size: 11, color: sel ? [5, 2, 20] : [255, 255, 255], weight: 700 });
    });
    // hover and selection rings
    const ring = (p, col) => { if (!p || p.kind !== 'obj') return; const y = p.y === null ? (TOP + BOT) / 2 : p.y + OY; c.strokeStyle = col; c.lineWidth = 2; c.setLineDash([4, 4]); c.beginPath(); c.arc(xOf(p.o.t), y, p.y === null ? 44 : 30, 0, 6.283); c.stroke(); c.setLineDash([]); };
    if (hover && (!selected || hover.o !== selected.o)) ring(hover, tool === 'erase' ? 'rgba(255,60,90,0.9)' : 'rgba(255,255,255,0.6)');
    if (selected) { const p = pickables().find(q => q.o === selected.o); if (p) ring(p, 'rgba(0,240,255,1)'); else selected = null; }
    // placement ghost
    if (mouse.in && !drag && tool !== 'erase' && tool !== 'move' && !showHelp) {
      const t = snap(tAt(mouse.x)), x = xOf(t);
      c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 1; c.setLineDash([3, 5]); c.beginPath(); c.moveTo(x, TOP); c.lineTo(x, BOT); c.stroke(); c.setLineDash([]);
      const gy = ['saw', 'orb'].includes(tool) || (tool === 'pad' && !['jump', 'phase'].includes(opts.pad)) ? BOT - cyAt(mouse.y) : ['spike', 'block', 'pad'].includes(tool) ? (surfaceAt(mouse.y) === 0 ? BOT - 20 : TOP + 20) : tool === 'fx' ? TOP + 40 : (TOP + BOT) / 2;
      c.fillStyle = 'rgba(255,255,255,0.18)'; c.beginPath(); c.arc(x, gy, 16, 0, 6.283); c.fill();
      const lab = tool === 'orb' ? opts.orb : tool === 'speed' ? '×' + opts.speed : tool === 'mode' ? opts.mode : tool === 'pad' ? opts.pad + (opts.pad === 'glide' ? (opts.padOn ? ' press' : ' release') : '') : tool === 'fx' ? opts.fx : tool;
      text(c, lab.toUpperCase() + '  ·  ' + fmtBeat(t).toUpperCase(), x, gy - 24, { size: 12, color: [255, 255, 255], spacing: 2, weight: 700, align: 'center' });
    }
    // cursor + readout
    c.strokeStyle = previewing ? 'rgba(255,60,90,0.95)' : 'rgba(0,240,255,0.9)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(m.PX, TOP - 100); c.lineTo(m.PX, BOT + (track && data.music === 'file' ? 100 : 40)); c.stroke();
    if (previewing) text(c, '● PREVIEW', m.PX + 8, BOT + 50, { size: 13, color: [255, 60, 90], spacing: 2, weight: 700 });
    const bar = Math.floor(cursor / 4) + 1, beat = Math.floor(cursor % 4) + 1, sub = Math.floor((cursor % 1) * 4 + 1e-6);
    text(c, 'BAR ' + String(bar).padStart(3, '0') + '  BEAT ' + beat + '.' + sub + '   ·   ' + data.name + '   ·   ' + data.bpm + ' BPM   ·   ' + data.bars + ' BARS   ·   ' + data.objects.length + ' OBJECTS   ·   ' + (data.fx || []).length + ' EFFECTS   ·   ♪ ' + (data.music === 'file' ? (track ? 'YOUR SONG' : 'NO SONG') : (data.music || 'synthwave').toUpperCase()) + (dirty ? '   ·   UNSAVED' : ''),
      12, TOP - 110, { size: 12, color: [0, 240, 255], spacing: 2, weight: 700 });
    // status bar
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(0, H - 40, W, 40);
    const tip = 'TOOL ' + tool.toUpperCase() + '   ·   CLICK PLACE   ·   RIGHT-CLICK REMOVE   ·   M MOVE   ·   P PREVIEW   ·   SPACE TEST   ·   CTRL+Z UNDO   ·   H HELP';
    text(c, (statusT > 0 && status ? status.toUpperCase() : tip), W / 2, H - 15, { size: 13, color: statusT > 0 ? [255, 255, 255] : [190, 190, 215], spacing: 2, weight: 600, align: 'center' });
    // scrollbar
    const frac = Math.min(1, cursor / maxCursor());
    c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillRect(40, H - 48, W - 80, 3);
    c.fillStyle = 'rgba(0,240,255,0.9)'; c.fillRect(40 + (W - 80) * frac - 2, H - 52, 4, 11);
    if (showHelp) drawHelp(c, W, H);
  }
  function drawHelp(c, W, H) {
    const text = api.text, w = Math.min(760, W - 40), h = HELP.length * 26 + 80, x0 = (W - w) / 2, y0 = Math.max(10, (H - h) / 2);
    c.fillStyle = 'rgba(5,2,20,0.94)'; c.fillRect(x0, y0, w, h);
    c.strokeStyle = 'rgba(0,240,255,0.8)'; c.lineWidth = 2; c.strokeRect(x0, y0, w, h);
    text(c, 'EDITOR CONTROLS', W / 2, y0 + 38, { size: 22, font: api.fontOf('title'), weight: 900, color: [255, 255, 255], align: 'center' });
    HELP.forEach(([k, v], i) => {
      text(c, k, x0 + 30, y0 + 74 + i * 26, { size: 14, color: [0, 240, 255], spacing: 2, weight: 700 });
      text(c, v.toUpperCase(), x0 + w * 0.42, y0 + 74 + i * 26, { size: 14, color: [230, 230, 245], spacing: 1, weight: 600 });
    });
    text(c, 'PRESS H OR CLICK TO CLOSE', W / 2, y0 + h - 14, { size: 11, color: [160, 160, 190], spacing: 3, weight: 700, align: 'center' });
  }

  return {
    open, update, draw, key, wheel, move, down, up, hideUI, loadSong, toolbarHeight,
    get cursor() { return cursor; }, get data() { return data; }, get track() { return track; }, get previewing() { return previewing; },
    get dirty() { return dirty; }, get selected() { return selected; },
  };
})();
</script>
